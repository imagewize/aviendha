applied_migrations = [
    "bash_read_only_defaults_v1",
]
include_commit_signature = false

[tools.bash]
allowlist = [
    "basename",
    "cat",
    "cd",
    "comm",
    "composer run lint",
    "composer run wpcs:scan",
    "cut",
    "date",
    "diff",
    "dirname",
    "du",
    "echo",
    "file",
    "find",
    "fmt",
    "fold",
    "gh pr diff",
    "gh pr view",
    "git branch",
    "git diff",
    "git fetch",
    "git grep",
    "git log",
    "git ls-files",
    "git rev-parse",
    "git show",
    "git status",
    "grep",
    "head",
    "join",
    "jq",
    "less",
    "ls",
    "md5sum",
    "more",
    "nl",
    "od",
    "paste",
    "php -l",
    "pwd",
    "readlink",
    "sha1sum",
    "sha256sum",
    "shasum",
    "sort",
    "stat",
    "sum",
    "tac",
    "tail",
    "test",
    "tr",
    "tree",
    "uname",
    "uniq",
    "vendor/bin/parallel-lint",
    "vendor/bin/phpcs",
    "wc",
    "which",
]
